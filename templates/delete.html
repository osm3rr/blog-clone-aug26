{% extends '_base.html' %}

{% block content %}
    <main>
        <h2>Eliminar Publicación</h2>
        <p>¿Estás seguro de que quieres eliminar la publicación "{{ post.title }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Sí, eliminar</button>
            <a href="{% url 'post_detail' post.pk %}">Cancelar</a>
        </form>
    </main>
{% endblock content %}
